<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蘆洲集賢社區長照機構 - 參訪預約系統</title>
    <!-- 引入 Tailwind CSS 讓介面簡潔美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="max-w-2xl mx-auto p-4 sm:p-6 my-8 bg-white rounded-xl shadow-md">
        <!-- 頂部標題與注意事項 -->
        <h1 class="text-2xl font-bold text-center text-emerald-700 mb-4">蘆洲集賢社區長照機構</h1>
        <h2 class="text-lg font-semibold text-center text-slate-600 mb-6">參訪預約系統</h2>

        <div class="bg-amber-50 border-l-4 border-amber-400 p-4 mb-6 rounded-r-lg text-sm text-amber-900 leading-relaxed">
            <p class="font-bold mb-1">為了維護長者健康與安全，參觀時請配合以下事項：</p>
            <p>1. <strong>全程佩戴口罩：</strong>進入本單位請全程佩戴口罩，感謝您的配合。</p>
            <p>2. <strong>參觀緩衝時間：</strong>為了不打擾長輩們的活動作息，每場參觀的緩衝等候時間約為 10 分鐘，請您見諒並依預約時間準時或稍候。</p>
        </div>

        <!-- 預約表單 (此處串接 Formspree 免費表單接收與自動回覆服務) -->
        <form id="visitForm" action="https://formspree.io/f/你的表單ID" method="POST" class="space-y-4" onsubmit="return validateForm(event)">
            
            <!-- 長輩姓名 -->
            <div>
                <label class="block font-medium mb-1">長輩姓名</label>
                <input type="text" name="elder_name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 長輩性別 (用點的男女) -->
            <div>
                <label class="block font-medium mb-1">長輩性別</label>
                <div class="flex gap-6">
                    <label class="flex items-center cursor-pointer"><input type="radio" name="elder_gender" value="男" required class="mr-2">男</label>
                    <label class="flex items-center cursor-pointer"><input type="radio" name="elder_gender" value="女" required class="mr-2">女</label>
                </div>
            </div>

            <!-- 長輩年齡 (需65歲以上) -->
            <div>
                <label class="block font-medium mb-1">長輩年齡</label>
                <input type="number" id="elder_age" name="elder_age" required min="0" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 家屬姓名 -->
            <div>
                <label class="block font-medium mb-1">家屬姓名</label>
                <input type="text" name="family_name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 與長輩關係 -->
            <div>
                <label class="block font-medium mb-1">與長輩關係</label>
                <select name="relationship" required class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="">請選擇</option>
                    <option value="本人">本人</option>
                    <option value="配偶">配偶</option>
                    <option value="子女">子女</option>
                    <option value="其他親屬">其他親屬</option>
                </select>
            </div>

            <!-- 聯絡電話 -->
            <div>
                <label class="block font-medium mb-1">聯絡電話</label>
                <input type="tel" name="phone" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 電子信箱 -->
            <div>
                <label class="block font-medium mb-1">電子信箱</label>
                <input type="email" name="email" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 是否有通過1966評估 -->
            <div>
                <label class="block font-medium mb-1">是否有通過 1966 評估</label>
                <select id="eval_1966" name="eval_1966" required class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="">請選擇</option>
                    <option value="有">有</option>
                    <option value="沒有">沒有</option>
                </select>
            </div>

            <!-- 評估後是幾級 -->
            <div>
                <label class="block font-medium mb-1">評估後是幾級</label>
                <select name="eval_level" required class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="">請選擇</option>
                    <option value="2~8級">2~8級</option>
                    <option value="不確定">不確定</option>
                </select>
            </div>

            <!-- 參訪人數 -->
            <div>
                <label class="block font-medium mb-1">參訪人數</label>
                <input type="number" name="visitors_count" min="1" value="1" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 預約日期 -->
            <div>
                <label class="block font-medium mb-1">預約日期</label>
                <input type="date" name="visit_date" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <!-- 預約時段 -->
            <div>
                <label class="block font-medium mb-1">預約時段</label>
                <select name="visit_time" required class="w-full border rounded-lg p-2 bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="">請選擇時段</option>
                    <option value="上午10:00~10:30">上午 10:00 ~ 10:30</option>
                    <option value="下午14:00~14:30">下午 14:00 ~ 14:30</option>
                </select>
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" class="w-full bg-emerald-600 text-white font-bold p-3 rounded-lg hover:bg-emerald-700 transition duration-200">
                確認送出預約
            </button>
        </form>
    </div>

    <!-- 即時檢核與阻擋邏輯 JavaScript -->
    <script>
        function validateForm(event) {
            const age = parseInt(document.getElementById('elder_age').value);
            const eval1966 = document.getElementById('eval_1966').value;

            // 檢查長輩年齡是否滿 65 歲
            if (age < 65) {
                alert("不接收65歲以下的長輩，沒有預約成功！");
                event.preventDefault(); // 阻止表單送出
                return false;
            }

            // 檢查是否有通過 1966 評估
            if (eval1966 === "沒有") {
                alert("機構需要有1966評估，沒有預約成功！");
                event.preventDefault(); // 阻止表單送出
                return false;
            }

            return true; // 驗證通過，正常送出
        }
    </script>
</body>
</html>
